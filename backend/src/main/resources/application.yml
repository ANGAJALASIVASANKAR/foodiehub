spring:
  application:
    name: foodiehub-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/foodiehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

foodiehub:
  jwt:
    secret: ${JWT_SECRET:foodiehub-development-secret-key-change-me-in-production-0123456789abcdef}
    access-token-expiration-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  delivery:
    base-delivery-charge: ${DELIVERY_CHARGE:40}
    free-delivery-threshold: ${FREE_DELIVERY_THRESHOLD:499}
    tax-rate-percent: ${TAX_RATE_PERCENT:5}

logging:
  level:
    com.foodiehub: INFO
    org.hibernate.SQL: WARN
